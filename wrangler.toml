name = "f1-sandbox-bot"
main = "src/index.js"
compatibility_date = "2024-02-08"

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "f1-db"
database_id = "00000000-0000-0000-0000-000000000000" # Needs to be updated in Cloudflare Dashboard or CI

# AI binding for Quiz generation
[ai]
binding = "AI"

# Cron Triggers
# 1. 0 0 * * * -> Every day at midnight for AI Quiz Generation
# 2. 0 * * * * -> Every hour for notification checks
[triggers]
crons = ["0 0 * * *", "0 * * * *"]

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true
